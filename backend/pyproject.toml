[project]
name = "personal-data-agent-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "email-validator>=2.2,<3",
  "pyjwt>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "cryptography>=43,<45",
  "python-multipart>=0.0.12,<1",
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "sqlglot>=26,<28",
  "openai>=1.54,<2",
  "tiktoken>=0.8,<1",
  "reportlab>=4.2,<5",
  "dramatiq[redis]>=1.17,<2",
  "redis>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.services"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
